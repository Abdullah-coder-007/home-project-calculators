<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-label="Measure the total rise from floor to floor, then the tread run" class="diagram-svg"><style>.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fa{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fb{fill:var(--surface-2);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fc{fill:var(--accent);fill-opacity:.35;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.dm{fill:none;stroke:var(--accent);stroke-width:2}.ah{fill:var(--accent)}.tx{fill:var(--ink);font:700 15px/1 var(--font, sans-serif)}.ts{fill:var(--muted);font:600 13px/1 var(--font, sans-serif)}</style><polygon class="fa" points="70.0,230.0 70.0,200.0 110.0,200.0 110.0,170.0 150.0,170.0 150.0,140.0 190.0,140.0 190.0,110.0 230.0,110.0 230.0,80.0 270.0,80.0 270.0,50.0 310.0,50.0 310.0,230.0"/><line class="ln" x1="310.0" y1="50.0" x2="370.0" y2="50.0"/><line class="ln" x1="30.0" y1="230.0" x2="370.0" y2="230.0"/><line class="dm" x1="350.0" y1="230.0" x2="350.0" y2="50.0"/><polygon class="ah" points="350.0,230.0 353.9,220.8 346.1,220.8"/><polygon class="ah" points="350.0,50.0 346.1,59.2 353.9,59.2"/><text class="tx" x="340.0" y="145.0" text-anchor="end">Total rise</text><line class="dm" x1="52.0" y1="230.0" x2="52.0" y2="200.0"/><polygon class="ah" points="52.0,230.0 55.9,220.8 48.1,220.8"/><polygon class="ah" points="52.0,200.0 48.1,209.2 55.9,209.2"/><text class="tx" x="44.0" y="220.0" text-anchor="end">Riser</text><line class="dm" x1="70.0" y1="186.0" x2="110.0" y2="186.0"/><polygon class="ah" points="70.0,186.0 79.2,189.9 79.2,182.1"/><polygon class="ah" points="110.0,186.0 100.8,182.1 100.8,189.9"/><text class="tx" x="90.0" y="176.0" text-anchor="middle">Tread</text><text class="ts" x="210.0" y="258.0" text-anchor="middle">Floor to finished floor above</text></svg>
