<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="Measure the house length and width, the overhang, and the roof pitch" class="diagram-svg"><style>.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fa{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fb{fill:var(--surface-2);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fc{fill:var(--accent);fill-opacity:.35;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.dm{fill:none;stroke:var(--accent);stroke-width:2}.ah{fill:var(--accent)}.tx{fill:var(--ink);font:700 15px/1 var(--font, sans-serif)}.ts{fill:var(--muted);font:600 13px/1 var(--font, sans-serif)}</style><polygon class="fc" points="88.0,188.0 220.0,94.0 352.0,188.0 330.0,190.0 220.0,110.0 110.0,190.0"/><polygon class="fb" points="110.0,190.0 330.0,190.0 330.0,234.0 110.0,234.0"/><line class="dm" x1="110.0" y1="250.0" x2="330.0" y2="250.0"/><polygon class="ah" points="110.0,250.0 119.2,253.9 119.2,246.1"/><polygon class="ah" points="330.0,250.0 320.8,246.1 320.8,253.9"/><text class="tx" x="220.0" y="272.0" text-anchor="middle">House width</text><line class="dm" x1="88.0" y1="202.0" x2="110.0" y2="202.0"/><polygon class="ah" points="88.0,202.0 97.2,205.9 97.2,198.1"/><polygon class="ah" points="110.0,202.0 100.8,198.1 100.8,205.9"/><text class="tx" x="0.0" y="-20.0" text-anchor="middle"></text><text class="ts" x="82.0" y="207.0" text-anchor="end">Overhang</text><line class="dm" x1="254.0" y1="118.2" x2="318.0" y2="118.2"/><line class="dm" x1="318.0" y1="118.2" x2="318.0" y2="163.8"/><text class="ts" x="286.0" y="110.2" text-anchor="middle">12 in run</text><text class="tx" x="326.0" y="146.0" text-anchor="start">Rise</text><text class="ts" x="210.0" y="22.0" text-anchor="middle">Pitch = rise per 12 in of run</text></svg>
