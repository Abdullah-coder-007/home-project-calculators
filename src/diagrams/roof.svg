<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Measure the house length and width, the overhang, and the roof pitch" class="diagram-svg"><style>.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fa{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fb{fill:var(--surface-2);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fc{fill:var(--accent);fill-opacity:.35;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.dm{fill:none;stroke:var(--accent);stroke-width:2}.ah{fill:var(--accent)}.tx{fill:var(--ink);font:700 15px/1 var(--font, sans-serif)}.ts{fill:var(--muted);font:600 13px/1 var(--font, sans-serif)}</style><polygon class="fc" points="60.0,196.0 210.0,92.0 360.0,196.0 340.0,200.0 210.0,110.0 80.0,200.0"/><polygon class="fb" points="80.0,200.0 340.0,200.0 340.0,240.0 80.0,240.0"/><line class="dm" x1="80.0" y1="254.0" x2="340.0" y2="254.0"/><polygon class="ah" points="80.0,254.0 89.2,257.9 89.2,250.1"/><polygon class="ah" points="340.0,254.0 330.8,250.1 330.8,257.9"/><text class="tx" x="210.0" y="250.0" text-anchor="middle">House width</text><line class="dm" x1="60.0" y1="170.0" x2="80.0" y2="170.0"/><polygon class="ah" points="60.0,170.0 69.2,173.9 69.2,166.1"/><polygon class="ah" points="80.0,170.0 70.8,166.1 70.8,173.9"/><text class="tx" x="0.0" y="0.0" text-anchor="middle"></text><text class="ts" x="54.0" y="162.0" text-anchor="end">Overhang</text><line class="dm" x1="250.0" y1="138.0" x2="320.0" y2="138.0"/><line class="dm" x1="250.0" y1="138.0" x2="250.0" y2="89.5"/><text class="ts" x="285.0" y="156.0" text-anchor="middle">12 in run</text><text class="ts" x="244.0" y="117.8" text-anchor="end">Rise</text><text class="ts" x="210.0" y="22.0" text-anchor="middle">Pitch = rise per 12 in of run · measure length along the eaves</text></svg>
