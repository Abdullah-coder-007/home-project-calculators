<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Measure each step's rise and run, the top landing depth and the step width" class="diagram-svg"><style>.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fa{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fb{fill:var(--surface-2);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fc{fill:var(--accent);fill-opacity:.35;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.dm{fill:none;stroke:var(--accent);stroke-width:2}.ah{fill:var(--accent)}.tx{fill:var(--ink);font:700 15px/1 var(--font, sans-serif)}.ts{fill:var(--muted);font:600 13px/1 var(--font, sans-serif)}</style><polygon class="fa" points="90.0,200.0 90.0,160.0 140.0,160.0 140.0,120.0 190.0,120.0 190.0,80.0 310.0,80.0 310.0,200.0"/><line class="dm" x1="68.0" y1="200.0" x2="68.0" y2="160.0"/><polygon class="ah" points="68.0,200.0 71.9,190.8 64.1,190.8"/><polygon class="ah" points="68.0,160.0 64.1,169.2 71.9,169.2"/><text class="tx" x="60.0" y="185.0" text-anchor="end">Rise</text><line class="dm" x1="90.0" y1="144.0" x2="140.0" y2="144.0"/><polygon class="ah" points="90.0,144.0 99.2,147.9 99.2,140.1"/><polygon class="ah" points="140.0,144.0 130.8,140.1 130.8,147.9"/><text class="tx" x="115.0" y="134.0" text-anchor="middle">Run</text><line class="dm" x1="190.0" y1="64.0" x2="310.0" y2="64.0"/><polygon class="ah" points="190.0,64.0 199.2,67.9 199.2,60.1"/><polygon class="ah" points="310.0,64.0 300.8,60.1 300.8,67.9"/><text class="tx" x="250.0" y="54.0" text-anchor="middle">Top step or landing</text><text class="ts" x="210.0" y="234.0" text-anchor="middle">Side view · the step width runs into the page</text></svg>
