<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Measure each step's rise and run, the top landing depth and the step width" class="diagram-svg"><style>.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fa{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fb{fill:var(--surface-2);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fc{fill:var(--accent);fill-opacity:.35;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.dm{fill:none;stroke:var(--accent);stroke-width:2}.ah{fill:var(--accent)}.tx{fill:var(--ink);font:700 15px/1 var(--font, sans-serif)}.ts{fill:var(--muted);font:600 13px/1 var(--font, sans-serif)}</style><polygon class="fa" points="50.0,210.0 50.0,170.0 100.0,170.0 100.0,130.0 150.0,130.0 150.0,90.0 260.0,90.0 260.0,210.0"/><line class="dm" x1="28.0" y1="210.0" x2="28.0" y2="170.0"/><polygon class="ah" points="28.0,210.0 31.9,200.8 24.1,200.8"/><polygon class="ah" points="28.0,170.0 24.1,179.2 31.9,179.2"/><text class="tx" x="20.0" y="195.0" text-anchor="end">Rise</text><line class="dm" x1="50.0" y1="154.0" x2="100.0" y2="154.0"/><polygon class="ah" points="50.0,154.0 59.2,157.9 59.2,150.1"/><polygon class="ah" points="100.0,154.0 90.8,150.1 90.8,157.9"/><text class="tx" x="75.0" y="144.0" text-anchor="middle">Run</text><line class="dm" x1="150.0" y1="74.0" x2="260.0" y2="74.0"/><polygon class="ah" points="150.0,74.0 159.2,77.9 159.2,70.1"/><polygon class="ah" points="260.0,74.0 250.8,70.1 250.8,77.9"/><text class="tx" x="205.0" y="64.0" text-anchor="middle">Top step or landing</text><text class="ts" x="200.0" y="240.0" text-anchor="middle">Side view · width runs into the page</text></svg>
