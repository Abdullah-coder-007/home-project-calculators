<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-label="Measure the hole's diameter and depth, and count the holes" class="diagram-svg"><style>.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fa{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fb{fill:var(--surface-2);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.fc{fill:var(--accent);fill-opacity:.35;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.dm{fill:none;stroke:var(--accent);stroke-width:2}.ah{fill:var(--accent)}.tx{fill:var(--ink);font:700 15px/1 var(--font, sans-serif)}.ts{fill:var(--muted);font:600 13px/1 var(--font, sans-serif)}</style><path class="fc" d="M150,50 L150,190 A60,18 0 0 0 270,190 L270,50 Z"/><ellipse class="fa" cx="210.0" cy="50.0" rx="60.0" ry="18.0"/><line class="dm" x1="150.0" y1="50.0" x2="270.0" y2="50.0"/><polygon class="ah" points="150.0,50.0 159.2,53.9 159.2,46.1"/><polygon class="ah" points="270.0,50.0 260.8,46.1 260.8,53.9"/><text class="tx" x="210.0" y="24.0" text-anchor="middle">Diameter</text><line class="dm" x1="296.0" y1="50.0" x2="296.0" y2="190.0"/><polygon class="ah" points="296.0,50.0 292.1,59.2 299.9,59.2"/><polygon class="ah" points="296.0,190.0 299.9,180.8 292.1,180.8"/><text class="tx" x="310.0" y="125.0" text-anchor="start">Depth</text><text class="ts" x="210.0" y="230.0" text-anchor="middle">Round column or post hole</text></svg>
