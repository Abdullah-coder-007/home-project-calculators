<!-- diagram: stairs -->
<div class="group">
  <p class="group-title">Height</p>
  <div class="row">
    <label class="field"><span>Total rise</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="totalRiseIn" value="108" data-example><span class="unit">in</span></span><span class="hint">From the lower floor to the top surface</span></label>
    <label class="field"><span>Max riser</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="maxRiserIn" value="7.75"><span class="unit">in</span></span><span class="hint">7 3/4 in under the IRC</span></label>
  </div>
</div>
<div class="group">
  <p class="group-title">Steps</p>
  <div class="row">
    <label class="field"><span>Tread depth</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="treadIn" value="10"><span class="unit">in</span></span><span class="hint">At least 10 in under the IRC</span></label>
    <label class="field"><span>Stair width</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="widthIn" value="36" data-example><span class="unit">in</span></span></label>
    <label class="field"><span>Stringer spacing</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="stringerSpacingIn" value="16"><span class="unit">in</span></span></label>
  </div>
</div>
