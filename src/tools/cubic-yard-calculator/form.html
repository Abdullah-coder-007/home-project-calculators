<div class="group">
  <p class="group-title">Area</p>
  <div data-area-builder></div>
</div>
<div class="group">
  <p class="group-title">Depth</p>
  <div class="row">
    <label class="field"><span>Depth</span><input type="number" inputmode="decimal" min="0" step="any" name="depth" value="6"></label>
    <label class="field"><span>Depth unit</span><select name="depthUnit"><option value="in" selected>inches</option><option value="ft">feet</option></select></label>
    <label class="field"><span>Extra for settling or waste</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="wastePct" value="0"><span class="unit">%</span></span><span class="hint">Add 5 to 10% for loose fill that compacts</span></label>
  </div>
</div>
