<div class="group">
  <p class="group-title">Driveway area</p>
  <div data-area-builder></div>
</div>

<div class="group">
  <p class="group-title">Stone layers (finished depth)</p>
  <div class="row">
    <label class="field"><span>Base: #3 stone</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="baseIn" value="4"><span class="unit">in</span></span><span class="hint">Fist-sized; 4 to 6 in on soil. 0 to skip</span></label>
    <label class="field"><span>Middle: #57 stone</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="middleIn" value="4"><span class="unit">in</span></span><span class="hint">3/4 to 1 in stone; about 4 in</span></label>
    <label class="field"><span>Top: #411 or crusher run</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="topIn" value="4"><span class="unit">in</span></span><span class="hint">Stone with fines that packs hard</span></label>
  </div>
</div>

<div class="group">
  <div class="row">
    <label class="field"><span>Extra for spreading and soft spots</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="wastePct" value="10"><span class="unit">%</span></span></label>
  </div>
  <label class="check"><input type="checkbox" name="fabric" checked> <span>Lay geotextile fabric under the stone</span></label>
</div>
