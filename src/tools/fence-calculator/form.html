<div class="group">
  <p class="group-title">Fence</p>
  <div class="row">
    <label class="field"><span>Total fence length</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="length" value="100"><span class="unit">ft</span></span></label>
    <label class="field"><span>Fence height</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="height" value="6"><span class="unit">ft</span></span></label>
  </div>
  <div class="row">
    <label class="field"><span>Post spacing</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="postSpacing" value="8"><span class="unit">ft</span></span></label>
    <label class="field"><span>Rails per section</span><select name="rails"><option value="2" selected>2 rails</option><option value="3">3 rails (taller fences)</option></select></label>
  </div>
</div>
<div class="group">
  <p class="group-title">Pickets</p>
  <div class="row">
    <label class="field"><span>Picket width</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="picketWidthIn" value="5.5"><span class="unit">in</span></span><span class="hint">A 1x6 picket is 5.5 in wide</span></label>
    <label class="field"><span>Gap between pickets</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="gapIn" value="0.5"><span class="unit">in</span></span><span class="hint">0 for a privacy fence</span></label>
  </div>
</div>
<div class="group">
  <p class="group-title">Post holes</p>
  <div class="row">
    <label class="field"><span>Hole diameter</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="holeDiameterIn" value="10"><span class="unit">in</span></span><span class="hint">About 3 times the post width</span></label>
    <label class="field"><span>Hole depth</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="holeDepthIn" value="30"><span class="unit">in</span></span><span class="hint">Below your frost line</span></label>
  </div>
</div>
