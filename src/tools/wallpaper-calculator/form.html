<div class="group">
  <p class="group-title">Room size</p>
  <div class="row">
    <div class="field ftin"><span>Length</span>
      <div class="ftin-pair">
        <label><input type="number" inputmode="decimal" min="0" step="any" name="length_ft" value="14"><span class="unit">ft</span></label>
        <label><input type="number" inputmode="decimal" min="0" step="any" name="length_in" value=""><span class="unit">in</span></label>
      </div>
    </div>
    <div class="field ftin"><span>Width</span>
      <div class="ftin-pair">
        <label><input type="number" inputmode="decimal" min="0" step="any" name="width_ft" value="12"><span class="unit">ft</span></label>
        <label><input type="number" inputmode="decimal" min="0" step="any" name="width_in" value=""><span class="unit">in</span></label>
      </div>
    </div>
  </div>
    <div class="field ftin"><span>Wall height</span>
      <div class="ftin-pair">
        <label><input type="number" inputmode="decimal" min="0" step="any" name="height_ft" value="8"><span class="unit">ft</span></label>
        <label><input type="number" inputmode="decimal" min="0" step="any" name="height_in" value=""><span class="unit">in</span></label>
      </div>
    </div>
</div>
<div class="group">
  <p class="group-title">Doors</p>
    <label class="field"><span>Doors</span><input type="number" inputmode="numeric" min="0" step="1" name="doors" value="1"><span class="hint">Strips over a door are skipped; windows still need strips</span></label>
</div>
<div class="group">
  <p class="group-title">Roll</p>
  <div class="row">
    <label class="field"><span>Roll width</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="rollWidthIn" value="20.5"><span class="unit">in</span></span></label>
    <label class="field"><span>Roll length</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="rollLengthFt" value="33"><span class="unit">ft</span></span></label>
    <label class="field"><span>Pattern repeat</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="repeatIn" value="0"><span class="unit">in</span></span><span class="hint">On the label. 0 for a random match</span></label>
  </div>
</div>
