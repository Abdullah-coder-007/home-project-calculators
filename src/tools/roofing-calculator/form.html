<div class="group">
  <p class="group-title">House footprint</p>
  <div class="row">
    <div class="field ftin"><span>Length</span>
      <div class="ftin-pair">
        <label><input type="number" inputmode="decimal" min="0" step="any" name="length_ft" value="40"><span class="unit">ft</span></label>
        <label><input type="number" inputmode="decimal" min="0" step="any" name="length_in" value=""><span class="unit">in</span></label>
      </div>
    </div>
    <div class="field ftin"><span>Width</span>
      <div class="ftin-pair">
        <label><input type="number" inputmode="decimal" min="0" step="any" name="width_ft" value="30"><span class="unit">ft</span></label>
        <label><input type="number" inputmode="decimal" min="0" step="any" name="width_in" value=""><span class="unit">in</span></label>
      </div>
    </div>
  </div>
    <label class="field"><span>Overhang (eaves)</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="overhangIn" value="12"><span class="unit">in</span></span><span class="hint">How far the roof sticks out past the walls</span></label>
</div>
<div class="group">
  <p class="group-title">Roof</p>
  <fieldset class="choices"><legend>Roof shape</legend><label><input type="radio" name="roofType" value="gable" checked><span>Gable (10% waste)</span></label><label><input type="radio" name="roofType" value="hip"><span>Hip (15% waste)</span></label></fieldset>
  <div class="row">
    <label class="field"><span>Pitch (rise per 12 in)</span><select name="pitch"><option value="1">1/12</option><option value="2">2/12</option><option value="3">3/12</option><option value="4">4/12</option><option value="5">5/12</option><option value="6" selected>6/12</option><option value="7">7/12</option><option value="8">8/12</option><option value="9">9/12</option><option value="10">10/12</option><option value="11">11/12</option><option value="12">12/12</option></select></label>
    <label class="field"><span>Underlayment per roll</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="underlaymentSqFt" value="1000"><span class="unit">sq ft</span></span><span class="hint">Synthetic rolls are often 1,000 sq ft</span></label>
  </div>
</div>
