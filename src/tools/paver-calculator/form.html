<div class="group">
  <p class="group-title">Patio or path area</p>
  <div data-area-builder></div>
</div>
<div class="group">
  <p class="group-title">Pavers</p>
  <div class="row">
    <label class="field"><span>Paver length</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="paverL" value="8"><span class="unit">in</span></span></label>
    <label class="field"><span>Paver width</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="paverW" value="4"><span class="unit">in</span></span></label>
    <label class="field"><span>Extra for cuts</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="wastePct" value="10"><span class="unit">%</span></span><span class="hint">15% for herringbone or curves</span></label>
  </div>
</div>
<div class="group">
  <p class="group-title">Base and edges</p>
  <div class="row">
    <label class="field"><span>Base gravel depth</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="baseIn" value="4"><span class="unit">in</span></span><span class="hint">4 to 6 in for patios</span></label>
    <label class="field"><span>Sand depth</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="sandIn" value="1"><span class="unit">in</span></span></label>
    <label class="field"><span>Open edges</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="edgeFt" value="48"><span class="unit">ft</span></span><span class="hint">Edges that need restraint</span></label>
  </div>
</div>
