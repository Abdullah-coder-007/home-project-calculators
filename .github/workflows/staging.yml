# Builds the staging branch as a private preview and publishes it to the gh-pages branch
# (GitHub Pages serves that branch). The live site, calcupine.com, is built from main by
# Cloudflare and is never touched by this workflow.
name: Staging preview
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staging
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install markdown pyyaml
      - run: node --test tests/*.test.js
      - run: STAGING=1 python3 build.py
      - name: Speed and accessibility check (Lighthouse)
        continue-on-error: true
        run: |
          npm i -g lighthouse@12 >/dev/null 2>&1
          (cd docs && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          echo "| Page | Performance | Accessibility | Best practices | SEO |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          for u in "" paint-calculator/ concrete-calculator/ flooring-calculator/ blog/walls/celery-2027-color-of-the-year-paint/; do
            lighthouse "http://localhost:8080/$u" --quiet --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh.json || continue
            node -e "const r=require('./lh.json');const c=r.categories;const f=k=>Math.round(c[k].score*100);
              require('fs').appendFileSync('docs/lighthouse.txt','LH /$u '+[f('performance'),f('accessibility'),f('best-practices'),f('seo')].join(' ')+'\\n');console.log('LH /$u', f('performance'), f('accessibility'), f('best-practices'), f('seo'));
              Object.values(r.audits).filter(a=>a.score!==null&&a.score<0.9&&a.scoreDisplayMode!=='informative'&&a.scoreDisplayMode!=='notApplicable').slice(0,12).forEach(a=>{require('fs').appendFileSync('docs/lighthouse.txt','  FIX '+a.id+' - '+a.title+(a.displayValue?' ('+a.displayValue+')':'')+'\\n'); if(a.id==='color-contrast'||a.id==='layout-shifts'){((a.details&&a.details.items)||[]).slice(0,8).forEach(it=>{const n=it.node||(it.subItems&&it.subItems.items&&it.subItems.items[0]&&it.subItems.items[0].node)||{};require('fs').appendFileSync('docs/lighthouse.txt','      '+(n.selector||'')+' :: '+(n.snippet||'').slice(0,120)+' :: '+((n.explanation||'').split('\\n').pop()||'').slice(0,140)+'\\n');});}});
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '| /$u | '+f('performance')+' | '+f('accessibility')+' | '+f('best-practices')+' | '+f('seo')+' |\\n');"
          done
      - name: Publish to gh-pages
        run: |
          cd docs
          touch .nojekyll
          rm -f CNAME
          git init -q -b gh-pages
          git config user.name "staging-bot"
          git config user.email "staging-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Staging preview of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
