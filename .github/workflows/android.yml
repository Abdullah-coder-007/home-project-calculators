# Builds the Calcupine Measure Android app on every push that changes android/.
# The test APK is attached to the "app-latest" pre-release on GitHub, so it can be
# downloaded straight onto a phone. If the build fails, the log goes to the ci-logs branch.
name: Android app
on:
  push:
    branches: [staging, main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle -p android assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Save the log when the build fails
        if: failure() && steps.build.outcome == 'failure'
        run: |
          mkdir -p /tmp/logs && tail -n 400 build.log > /tmp/logs/android-build.txt
          cd /tmp/logs && git init -q -b ci-logs && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "Android build log ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk calcupine-measure-test.apk
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest calcupine-measure-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Calcupine Measure (test build ${GITHUB_RUN_NUMBER})" \
            --notes "Test build from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install on an ARCore phone: download the APK, open it, allow installing from this source."
